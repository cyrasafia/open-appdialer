name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --stacktrace

      - name: APK size guard (spec: release ≤ 2MB)
        run: |
          SIZE=$(stat -c%s app/build/outputs/apk/release/app-release.apk)
          echo "release APK size: $SIZE bytes ($(du -h app/build/outputs/apk/release/app-release.apk | cut -f1))"
          if [ "$SIZE" -gt 2097152 ]; then
            echo "::error::release APK exceeds 2MB spec limit: $SIZE bytes"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
