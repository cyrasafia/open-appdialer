name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Report APK size
        run: |
          SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "debug APK size: $SIZE bytes ($(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1))"
          # debug APK 不裁剪、仅作参考；spec 的 ≤2MB 硬指标在 M4 开启 R8 后对 release 生效

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
